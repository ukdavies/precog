<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreCog · All results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>PreCog</h1>
    <div class="tag">A sequence of shapes has been chosen before you begin. Can you sense them?</div>
    <nav class="nav">
      <a href="./">Take the test</a>
      <a href="results.html" class="on">All results</a>
    </nav>
  </header>

  <!-- Results -->
  <section class="card" id="logCard">
    <div class="log-head">
      <h2>All results</h2>
      <div class="filter">
        <label for="who-filter" style="margin:0">Player</label>
        <select id="who-filter"><option value="">Everyone</option></select>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div id="logBody"><div class="empty">Loading…</div></div>
    <div class="note" id="logNote"></div>
  </section>
</div>

<script src="common.js"></script>
<script>
(() => {
  let allRounds = [];
  let shared = false;
  async function loadShared() {
    try {
      const rows = await sbFetch(SB_URL + "?select=id,created_at,name,n,hits,pct,targets,guesses,salt,seal&order=created_at.desc&limit=5000");
      shared = true;
      allRounds = rows.map(fromRow).concat(localRounds().map(r => Object.assign({ local: true }, r)));
      $("logNote").textContent = "Shared log: everyone who visits sees every try. Click a row for the full sequence.";
    } catch (e) {
      console.warn("load failed", e);
      if (!shared) {
        allRounds = localRounds().map(r => Object.assign({ local: true }, r));
        $("logNote").textContent = "The shared log can't be reached right now, so tries are kept on this device. Click a row for the full sequence.";
      }
    }
    renderLog();
  }
  // ---------- log rendering ----------
  const filterEl = $("who-filter");
  filterEl.addEventListener("change", renderLog);
  let openRow = null;

  function renderLog() {
    const names = Array.from(new Set(allRounds.map(r => r.name))).sort((a, b) => a.localeCompare(b));
    const cur = filterEl.value;
    filterEl.innerHTML = `<option value="">Everyone</option>` + names.map(n => `<option${n === cur ? " selected" : ""}>${esc(n)}</option>`).join("");
    const rows = allRounds.filter(r => !cur || r.name === cur).sort((a, b) => (b.at || "").localeCompare(a.at || ""));

    const trials = rows.reduce((a, r) => a + r.n, 0);
    const hits = rows.reduce((a, r) => a + r.hits, 0);
    const overall = trials ? (hits / trials * 100) : 0;
    const best = rows.reduce((m, r) => Math.max(m, r.pct), 0);
    const p = trials ? pAtLeast(hits, trials) : 1;
    $("stats").innerHTML = `
      <div class="stat"><div class="v">${rows.length}</div><div class="l">Rounds</div></div>
      <div class="stat"><div class="v">${trials}</div><div class="l">Shapes guessed</div></div>
      <div class="stat"><div class="v">${trials ? overall.toFixed(1) + "%" : "–"}</div><div class="l">Overall hit rate (chance 25%)</div></div>
      <div class="stat"><div class="v">${rows.length ? best + "%" : "–"}</div><div class="l">Best round</div></div>`
      + (trials && overall > 25 ? `` : ``);

    if (!rows.length) { $("logBody").innerHTML = `<div class="empty">No tries yet. Be the first.</div>`; return; }
    let html = `<table><thead><tr><th>When</th><th>Player</th><th class="num">Correct</th><th class="num">Score</th></tr></thead><tbody>`;
    rows.forEach((r, idx) => {
      const when = r.at ? new Date(r.at).toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
      const key = (r.seal || "") + idx;
      html += `<tr class="click" data-key="${esc(key)}"><td>${esc(when)}</td><td>${esc(r.name)}${r.local ? ' <span style="color:var(--muted);font-size:12px">(this device)</span>' : ""}</td><td class="num">${r.hits}/${r.n}</td><td class="num">${r.pct}%</td></tr>`;
      if (openRow === key) html += detailRow(r);
    });
    html += `</tbody></table>`;
    if (trials) html += `<div class="note">Across these ${trials} guesses, the chance of doing at least this well by guessing is ${(p * 100).toFixed(p < 0.01 ? 3 : 1)}%.</div>`;
    $("logBody").innerHTML = html;
    $("logBody").querySelectorAll("tr.click").forEach(tr => tr.addEventListener("click", () => {
      openRow = openRow === tr.dataset.key ? null : tr.dataset.key;
      renderLog();
    }));
  }
  function detailRow(r) {
    const t = (r.targets || "").split(""), g = (r.guesses || "").split("");
    const pips = t.map((c, i) => {
      const ts = FROM_CODE[c], gs = FROM_CODE[g[i]];
      if (!ts || !gs) return "";
      const hit = ts === gs;
      return `<div class="pip ${hit ? "hit" : "miss"}" title="${i + 1}: guessed ${LABEL[gs]}, was ${LABEL[ts]}">${shapeSvg(ts)}</div>`;
    }).join("");
    const gpips = g.map(c => FROM_CODE[c] ? `<div class="pip">${shapeSvg(FROM_CODE[c])}</div>` : "").join("");
    return `<tr class="detail"><td colspan="4">
      <div style="font-size:12px;color:var(--muted);margin-bottom:4px">Answers (green = hit)</div><div class="mini">${pips}</div>
      <div style="font-size:12px;color:var(--muted);margin:8px 0 4px">Guesses</div><div class="mini">${gpips}</div>
    </td></tr>`;
  }

  loadShared();
  setInterval(() => { if (!document.hidden) loadShared(); }, 30000);
})();
</script>
</body>
</html>
